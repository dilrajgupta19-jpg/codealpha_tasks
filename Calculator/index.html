<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- TOP BAR -->
        <header class="topbar">
            <div>
                <h1>Calc<span>∞</span></h1>
                <p>Scientific Calculator</p>
            </div>

            <div class="top-actions">
                <button id="historyBtn" title="History">🕘</button>
                <button id="themeBtn" title="Change Theme">☀️</button>
            </div>
        </header>


        <!-- CALCULATOR -->
        <main class="calculator">

            <!-- DISPLAY -->
            <div class="display-box">

                <div class="display-top">
                    <span id="modeText">DEG</span>

                    <button id="copyBtn" title="Copy Result">
                        📋
                    </button>
                </div>

                <div id="expression">0</div>

                <div id="result">0</div>

            </div>


            <!-- MODE BAR -->
            <div class="mode-bar">

                <button id="angleBtn" class="active">
                    DEG
                </button>

                <button id="sciBtn">
                    SCI
                </button>

            </div>


            <!-- SCIENTIFIC BUTTONS -->
            <div id="scientificKeys" class="scientific-keys">

                <button onclick="appendFunction('sin')">
                    sin
                </button>

                <button onclick="appendFunction('cos')">
                    cos
                </button>

                <button onclick="appendFunction('tan')">
                    tan
                </button>

                <button onclick="appendFunction('log')">
                    log
                </button>

                <button onclick="appendFunction('ln')">
                    ln
                </button>

                <button onclick="appendFunction('sqrt')">
                    √
                </button>

                <button onclick="squareValue()">
                    x²
                </button>

                <button onclick="appendValue('π')">
                    π
                </button>

                <button onclick="appendValue('e')">
                    e
                </button>

                <button onclick="appendValue('(')">
                    (
                </button>

                <button onclick="appendValue(')')">
                    )
                </button>

                <button onclick="factorial()">
                    x!
                </button>

            </div>


            <!-- MAIN BUTTONS -->
            <div class="keys">

                <button class="danger" onclick="clearAll()">AC</button>

                <button onclick="deleteLast()">⌫</button>

                <button onclick="appendValue('%')">%</button>

                <button class="operator" onclick="appendValue('÷')">
                    ÷
                </button>


                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>

                <button class="operator" onclick="appendValue('×')">
                    ×
                </button>


                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>

                <button class="operator" onclick="appendValue('-')">
                    −
                </button>


                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>

                <button class="operator" onclick="appendValue('+')">
                    +
                </button>


                <button class="zero" onclick="appendValue('0')">
                    0
                </button>

                <button onclick="appendValue('.')">
                    .
                </button>

                <button class="equal" onclick="calculate()">
                    =
                </button>

            </div>

        </main>


        <!-- HISTORY PANEL -->
        <aside id="historyPanel" class="history-panel">

            <div class="history-header">
                <h2>History</h2>

                <button id="closeHistory">
                    ✕
                </button>
            </div>

            <div id="historyList">
                <p class="empty-history">
                    No calculations yet
                </p>
            </div>

            <button id="clearHistory" class="clear-history">
                Clear History
            </button>

        </aside>

    </div>


    <script src="script.js"></script>

</body>
</html>
